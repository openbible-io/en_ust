name: Validate USFM -be- Branch
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
  push:
    branches:
      - '*-be-*'

jobs:
  validate-be:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: USFM File Validation Results <==== Click Here
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Validate whenever the -be- branch is the source: on a push to a -be- branch,
          # or on a PR whose head (source) branch contains -be- (regex .*-be-.*).
          # Any other PR auto-passes, so this check can be required on the base branch (master).
          if [ "$EVENT_NAME" = "push" ]; then
            BRANCH="$REF_NAME"
          else
            BRANCH="$HEAD_REF"
          fi
          if echo "$BRANCH" | grep -q -- '-be-'; then
            echo "Branch '$BRANCH' matches '-be-'; running validation."
            python .gitea/workflows/validate_usfm_files.py
          else
            echo "Branch '$BRANCH' does not contain '-be-'; skipping validation (auto-pass)."
          fi
