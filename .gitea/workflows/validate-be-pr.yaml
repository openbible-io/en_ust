name: Validate USFM -be- Branch PR
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

jobs:
  validate-be-pr:
    # Only gate PRs whose base branch matches the -be- pattern (regex .*-be-.*).
    if: contains(github.base_ref, '-be-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: USFM File Validation Results <==== Click Here
        run: |
          python .gitea/workflows/validate_usfm_files.py
