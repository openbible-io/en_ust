name: Validate live-snapshot and auto-merge PR

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # every day at 2am Eastern, 6 am UTC

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # checkout + merge the PR
      pull-requests: write  # read PR state, post comments, delete bot comments
      issues: write         # PR comments live on the issues endpoint in Gitea
    env:
      HEAD_BRANCH: live-snapshot
      BASE_BRANCH: master
      BOT_MARKER: '<!-- ust-validation-bot -->'
      API: ${{ github.server_url }}/api/v1
      REPO: ${{ github.repository }}
      TOKEN: ${{ secrets.GITEA_TOKEN }}

    steps:
      - name: Find open PR from live-snapshot to master
        id: find_pr
        run: |
          set -euo pipefail
          # Gitea API: list PRs filtered by state, then match head/base client-side.
          # (Gitea's /pulls endpoint doesn't reliably filter by head/base via query params
          # across versions, so we filter the JSON ourselves.)
          response=$(curl -sS -H "Authorization: token ${TOKEN}" \
            "${API}/repos/${REPO}/pulls?state=open&limit=50")

          pr_number=$(echo "$response" | python3 -c "
          import json, sys, os
          head = os.environ['HEAD_BRANCH']
          base = os.environ['BASE_BRANCH']
          prs = json.load(sys.stdin)
          for pr in prs:
              if pr.get('head', {}).get('ref') == head and pr.get('base', {}).get('ref') == base:
                  print(pr['number'])
                  break
          ")

          if [ -z "$pr_number" ]; then
            echo "No open PR from ${HEAD_BRANCH} to ${BASE_BRANCH}; nothing to do."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "has_pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found PR #${pr_number}"
            echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
            echo "has_pr=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout live-snapshot branch
        if: steps.find_pr.outputs.has_pr == 'true'
        uses: actions/checkout@v3
        with:
          ref: live-snapshot

      - name: Setup Python
        if: steps.find_pr.outputs.has_pr == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.find_pr.outputs.has_pr == 'true'
        run: python -m pip install --upgrade pip pyyaml

      - name: Run USFM file validation
        if: steps.find_pr.outputs.has_pr == 'true'
        id: validate
        run: |
          set +e
          python .gitea/workflows/validate_usfm_files.py > validation_output.txt 2>&1
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          echo "----- validation output -----"
          cat validation_output.txt
          echo "----- exit code: ${exit_code} -----"

      - name: Handle validation failure (post error comment, deduped)
        if: steps.find_pr.outputs.has_pr == 'true' && steps.validate.outputs.exit_code != '0'
        env:
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import json, os, urllib.request, urllib.error

          api = os.environ['API']
          repo = os.environ['REPO']
          token = os.environ['TOKEN']
          pr = os.environ['PR_NUMBER']
          marker = os.environ['BOT_MARKER']

          with open('validation_output.txt', 'r', encoding='utf-8', errors='replace') as f:
              output = f.read()

          # Gitea may reject very large comment bodies; cap at 60k chars.
          MAX = 60000
          truncated_note = ''
          if len(output) > MAX:
              output = output[:MAX]
              truncated_note = '\n\n*(output truncated to fit comment size)*'

          body = (
              f"{marker}\n"
              f"### ❌ live-snapshot validation failed\n\n"
              f"Validation of the `live-snapshot` branch failed. Errors below:\n\n"
              f"```\n{output}\n```"
              f"{truncated_note}"
          )

          def api_request(method, path, data=None):
              url = f"{api}{path}"
              req_data = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=req_data, method=method)
              req.add_header('Authorization', f'token {token}')
              req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode()) if resp.length != 0 else None

          # Fetch existing comments to dedupe
          comments = api_request('GET', f'/repos/{repo}/issues/{pr}/comments')
          bot_comments = [c for c in (comments or []) if marker in (c.get('body') or '')]

          # If the most recent bot comment has identical body, skip posting.
          if bot_comments:
              last = bot_comments[-1]
              if (last.get('body') or '').strip() == body.strip():
                  print(f"Identical error comment already exists (#{last['id']}); skipping post.")
                  raise SystemExit(0)

          api_request('POST', f'/repos/{repo}/issues/{pr}/comments', {'body': body})
          print(f"Posted validation error comment to PR #{pr}")
          PYEOF

      - name: Handle validation success (clear old errors, attempt merge)
        if: steps.find_pr.outputs.has_pr == 'true' && steps.validate.outputs.exit_code == '0'
        env:
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import json, os, urllib.request, urllib.error

          api = os.environ['API']
          repo = os.environ['REPO']
          token = os.environ['TOKEN']
          pr = os.environ['PR_NUMBER']
          marker = os.environ['BOT_MARKER']

          def api_request(method, path, data=None, expect_json=True):
              url = f"{api}{path}"
              req_data = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=req_data, method=method)
              req.add_header('Authorization', f'token {token}')
              req.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read().decode()
                      if expect_json and raw:
                          return resp.status, json.loads(raw)
                      return resp.status, raw
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          # 1) Auto-resolve: delete prior bot error comments on this PR.
          status, comments = api_request('GET', f'/repos/{repo}/issues/{pr}/comments')
          if isinstance(comments, list):
              for c in comments:
                  if marker in (c.get('body') or ''):
                      cid = c['id']
                      del_status, _ = api_request('DELETE', f'/repos/{repo}/issues/comments/{cid}', expect_json=False)
                      print(f"Deleted stale bot comment #{cid} (status {del_status})")

          # 2) Check PR mergeability.
          status, pr_data = api_request('GET', f'/repos/{repo}/pulls/{pr}')
          if status != 200 or not isinstance(pr_data, dict):
              print(f"Failed to fetch PR: status={status} body={pr_data}")
              raise SystemExit(1)

          mergeable = pr_data.get('mergeable')
          has_conflicts = pr_data.get('has_merge_conflicts', False)

          if has_conflicts or mergeable is False:
              # Post a conflict comment (deduped against last bot comment).
              body = (
                  f"{marker}\n"
                  f"### ⚠️ Cannot merge: conflicts detected\n\n"
                  f"Validation of `live-snapshot` passed, but this PR has merge conflicts with `{pr_data.get('base', {}).get('ref', 'master')}`. "
                  f"Please resolve conflicts and the auto-merger will retry on the next run."
              )
              status, fresh_comments = api_request('GET', f'/repos/{repo}/issues/{pr}/comments')
              bot_comments = [c for c in (fresh_comments or []) if marker in (c.get('body') or '')] if isinstance(fresh_comments, list) else []
              if bot_comments and (bot_comments[-1].get('body') or '').strip() == body.strip():
                  print("Identical conflict comment already present; skipping.")
              else:
                  api_request('POST', f'/repos/{repo}/issues/{pr}/comments', {'body': body})
                  print(f"Posted conflict comment to PR #{pr}")
              raise SystemExit(0)

          # 3) Merge.
          merge_payload = {
              'Do': 'merge',
              'merge_when_checks_succeed': False,
          }
          status, result = api_request('POST', f'/repos/{repo}/pulls/{pr}/merge', merge_payload, expect_json=False)
          if status in (200, 204):
              print(f"✅ Merged PR #{pr}")
          else:
              print(f"❌ Merge failed: status={status} body={result}")
              # Surface the failure as a comment so it's not silent.
              body = (
                  f"{marker}\n"
                  f"### ⚠️ Auto-merge failed\n\n"
                  f"Validation passed but the merge API returned status `{status}`:\n\n"
                  f"```\n{result}\n```"
              )
              api_request('POST', f'/repos/{repo}/issues/{pr}/comments', {'body': body})
              raise SystemExit(1)
          PYEOF