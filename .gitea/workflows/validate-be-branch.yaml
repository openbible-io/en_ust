name: Validate USFM -be- Branch
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  validate-be:
    if: ${{ contains(github.head_ref, '-be-') && github.base_ref == 'master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: USFM File Validation Results <==== Click Here
        run: |
          REF_NAME="${{ github.head_ref }}"
          BOOK="$(printf '%s' "${REF_NAME}" | sed 's/-be.*//' | tr '[:upper:]' '[:lower:]')"
          echo "Validating book '${BOOK}' from branch '${REF_NAME}'"
          if [ -n "${BOOK}" ]; then
            python .gitea/workflows/validate_usfm_files.py --book "${BOOK}"
          else
            python .gitea/workflows/validate_usfm_files.py
          fi
