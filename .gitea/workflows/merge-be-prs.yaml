name: Merge -be- Branch PRs
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # every day at 2am Eastern, 6 am UTC

jobs:
  merge-be-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # merge the PRs
      pull-requests: write  # read PR state and merge
      issues: write         # PR endpoints live under the issues API in Gitea
    env:
      API: ${{ github.server_url }}/api/v1
      REPO: ${{ github.repository }}
      TOKEN: ${{ secrets.GITEA_TOKEN }}
      BE_PATTERN: '-be-'  # merge PRs whose head (source) branch contains this (regex .*-be-.*)

    steps:
      - name: Merge mergeable open PRs from -be- branches
        id: merge
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import json, os, urllib.request, urllib.error

          api = os.environ['API']
          repo = os.environ['REPO']
          token = os.environ['TOKEN']
          pattern = os.environ.get('BE_PATTERN', '-be-')

          def api_request(method, path, data=None, expect_json=True):
              url = f"{api}{path}"
              req_data = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=req_data, method=method)
              req.add_header('Authorization', f'token {token}')
              req.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read().decode()
                      if expect_json and raw:
                          return resp.status, json.loads(raw)
                      return resp.status, raw
              except urllib.error.HTTPError as e:
                  raw = e.read().decode()
                  try:
                      return e.code, json.loads(raw)
                  except Exception:
                      return e.code, raw

          # Collect every open PR whose head (source) branch matches the -be- pattern.
          be_prs = []
          page = 1
          while True:
              status, prs = api_request('GET', f'/repos/{repo}/pulls?state=open&limit=50&page={page}')
              if status != 200 or not isinstance(prs, list) or not prs:
                  break
              for pr in prs:
                  head_ref = (pr.get('head') or {}).get('ref') or ''
                  if pattern in head_ref:
                      be_prs.append(pr)
              if len(prs) < 50:
                  break
              page += 1

          if not be_prs:
              print(f"No open PRs from a head branch matching '{pattern}'; nothing to do.")
              raise SystemExit(0)

          print(f"Found {len(be_prs)} open PR(s) from '{pattern}' branches.")

          merged = []
          failed = []

          for pr in be_prs:
              num = pr['number']
              base_ref = (pr.get('base') or {}).get('ref') or '?'
              head_ref = (pr.get('head') or {}).get('ref') or '?'
              label = f"#{num} ({head_ref} -> {base_ref})"

              # Fetch fresh detail so mergeability reflects the latest check/conflict state.
              status, detail = api_request('GET', f'/repos/{repo}/pulls/{num}')
              if status != 200 or not isinstance(detail, dict):
                  failed.append((label, f"could not fetch PR detail (status {status})"))
                  continue

              if detail.get('has_merge_conflicts'):
                  failed.append((label, "merge conflicts"))
                  continue
              if detail.get('mergeable') is False:
                  failed.append((label, "not mergeable (conflicts or failing/pending status checks)"))
                  continue

              # Merge now; merge_when_checks_succeed=False means the API rejects (rather than
              # queues) if required checks have not passed, which we surface as a failure.
              status, result = api_request(
                  'POST', f'/repos/{repo}/pulls/{num}/merge',
                  {'Do': 'merge', 'merge_when_checks_succeed': False},
                  expect_json=False,
              )
              if status in (200, 204):
                  merged.append(label)
                  print(f"Merged {label}")
              else:
                  failed.append((label, f"merge API status {status}: {result}"))
                  print(f"Failed to merge {label}: status {status}: {result}")

          print("")
          print("===== -be- PR auto-merge report =====")
          print(f"Merged ({len(merged)}):")
          for m in merged:
              print(f"  - {m}")
          print(f"Failed ({len(failed)}):")
          for lbl, reason in failed:
              print(f"  - {lbl}: {reason}")

          # Expose results as step outputs.
          gh_out = os.environ.get('GITHUB_OUTPUT')
          if gh_out:
              with open(gh_out, 'a', encoding='utf-8') as f:
                  f.write(f"merged_count={len(merged)}\n")
                  f.write(f"failed_count={len(failed)}\n")
                  f.write("merged_prs=" + ", ".join(merged) + "\n")
                  f.write("failed_prs=" + ", ".join(lbl for lbl, _ in failed) + "\n")

          # Render a summary on the workflow run page.
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as f:
                  f.write("## -be- PR auto-merge\n\n")
                  f.write(f"**Merged:** {len(merged)} | **Failed:** {len(failed)}\n\n")
                  if merged:
                      f.write("### Merged\n")
                      for m in merged:
                          f.write(f"- (merged) {m}\n")
                      f.write("\n")
                  if failed:
                      f.write("### Failed\n")
                      for lbl, reason in failed:
                          f.write(f"- (failed) {lbl}: {reason}\n")

          if failed:
              print(f"\n{len(failed)} PR(s) from '{pattern}' branches could not be merged.")
              raise SystemExit(1)

          print(f"\nAll {len(merged)} open PR(s) from '{pattern}' branches merged successfully.")
          PYEOF
